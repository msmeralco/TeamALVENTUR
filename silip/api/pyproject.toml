[project]
name = "silip-api"
version = "0.1.0"
description = "SILIP FastAPI app (served by AWS Lambda through Mangum)"
requires-python = ">=3.12"
dependencies = [
  "silip-ml",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mangum>=0.19",
  "pyjwt[crypto]>=2.9",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silip"]

[tool.uv.sources]
silip-ml = { workspace = true }
