name: silip-local
services:
  db:
    image: postgres:18
    env_file: .local/postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silip_owner -d silip_local"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
