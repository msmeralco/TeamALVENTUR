<!doctype html><html><head><meta charset="utf-8">
<!-- Rendered at 760x256 (2x), downscaled to 380x128. #dark puts the mark on a cream tile. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}
.w{display:flex;align-items:center;gap:36px;height:256px;padding:0 32px;box-sizing:border-box;width:760px}
.m{width:192px;height:192px;border-radius:44px;display:grid;place-items:center;flex:none}
.m img{width:192px;height:192px;display:block}
.dark .m{background:#F2EFE3}
.dark .m img{width:156px;height:156px}
.t{font:700 156px/1 'Space Grotesk';letter-spacing:-4px;color:#262626;padding-bottom:16px}
.dark .t{color:#F2EFE3}
</style></head><body><div class="w" id="w"><div class="m"><img src="silip-mark-512.png" alt=""></div><div class="t">silip</div></div>
<script>if(location.hash==='#dark')document.getElementById('w').classList.add('dark');</script></body></html>
