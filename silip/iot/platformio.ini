; SILIP clamp node. The node measures only; it never switches power (.agents/rules/iot-firmware.md).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
test_ignore = *

; Host-side unit tests for lib/power (pure math, no Arduino headers): pio test -e native
[env:native]
platform = native
test_framework = unity
lib_ignore = sensor, transport
